name: Build and Deploy Extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resmi Şablonu Klonla (Git Clone Çözümü)
        run: |
          # 1. Bozuk inen ZIP yöntemi yerine doğrudan Git ile klonluyoruz
          git clone https://github.com/recloudstream/cloudstream-extensions-template.git temp_template
          
          # 2. Çalışan orijinal şablon dosyalarını kopyala
          cp temp_template/build.gradle.kts .
          cp temp_template/settings.gradle.kts .
          cp -r temp_template/gradle .
          cp temp_template/gradlew .
          cp temp_template/gradlew.bat .
          
          # 3. Modül ayar dosyasını orijinal şablondan al
          mkdir -p AtomSpor
          cp temp_template/ExampleProvider/build.gradle.kts AtomSpor/
          
          # 4. Ayarları senin eklentine göre otomatik değiştir
          sed -i 's/ExampleProvider/AtomSpor/g' settings.gradle.kts
          sed -i 's/name = "ExampleProvider"/name = "AtomSporTV"/' AtomSpor/build.gradle.kts
          sed -i 's/description = "Test"/description = "AtomSporTV Canlı Maç ve TV Kanalları"/' AtomSpor/build.gradle.kts
          sed -i 's/authors = listOf("LagradOst")/authors = listOf("N0jen")/' AtomSpor/build.gradle.kts
          sed -i 's/tvTypes = listOf("Others")/tvTypes = listOf("Live")/' AtomSpor/build.gradle.kts
          
          # 5. Senin kodlarını (.kt dosyaları) dışarıdaysa doğru yere taşı
          if [ -d "src" ]; then
            mv src AtomSpor/ || true
          fi
          
          # 6. Geçici klon dosyasını sil
          rm -rf temp_template
          
          # 7. Çalıştırma izni ver
          chmod +x gradlew

      - name: Eklentiyi Derle (.cs3)
        run: ./gradlew make --no-daemon

      - name: Master JSON Oluştur
        run: ./gradlew makePluginsJson --no-daemon

      - name: Dağıtıma Hazırla
        run: |
          mkdir -p _deploy
          find . -type f -name "*.cs3" -exec cp {} _deploy/ \;
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json _deploy/repo.json
            cp build/plugins.json _deploy/plugins.json
          fi
          
      - name: Yayına Al (Deploy)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: builds
          force_orphan: true
