name: Build and Deploy Extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.4 Entegrasyonu (Gömülü Çözüm)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Sistemi Temizle ve Groovy Formatına Çevir
        run: |
          # 1. Yanlış yerdeki src klasörü varsa güvenle taşı
          if [ -d "src" ]; then
            mkdir -p AtomSpor
            mv src AtomSpor/
          fi
          
          # 2. Hataya sebep olan katı Kotlin (.kts) dosyalarını sil
          rm -f build.gradle.kts settings.gradle.kts AtomSpor/build.gradle.kts gradlew gradlew.bat
          
          # 3. Ana Ayar Dosyası (Esnek Groovy Formatı)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { 
                      url 'https://jitpack.io' 
                      metadataSources { mavenPom(); artifact() }
                  }
              }
              dependencies {
                  classpath 'com.github.recloudstream:gradle:master-SNAPSHOT'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { 
                      url 'https://jitpack.io' 
                      metadataSources { mavenPom(); artifact() }
                  }
              }
          }
          EOF
          
          # 4. Settings Dosyası
          cat << 'EOF' > settings.gradle
          rootProject.name = 'N0JEN-Sync'
          include ':AtomSpor'
          EOF
          
          # 5. Eklenti Ayar Dosyası (Esnek Groovy Formatı)
          mkdir -p AtomSpor
          cat << 'EOF' > AtomSpor/build.gradle
          apply plugin: 'com.lagradost.cloudstream3.plugins'
          
          cloudstream {
              name = "AtomSporTV"
              description = "AtomSporTV Canlı Maç ve TV Kanalları"
              authors = ["N0jen"]
              version = 1
              tvTypes = ["Live"]
          }
          EOF

      - name: Eklentiyi Derle (.cs3)
        run: gradle make --no-daemon

      - name: Master JSON Oluştur
        run: gradle makePluginsJson --no-daemon

      - name: Dağıtıma Hazırla
        run: |
          mkdir -p _deploy
          find . -type f -name "*.cs3" -exec cp {} _deploy/ \;
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json _deploy/repo.json
            cp build/plugins.json _deploy/plugins.json
          fi
          
      - name: Yayına Al (Deploy)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: builds
          force_orphan: true
