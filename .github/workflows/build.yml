name: Build and Deploy Extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Extension
        run: ./gradlew make --no-daemon

      - name: Generate JSON
        run: ./gradlew makePluginsJson --no-daemon

      - name: Deploy
        run: |
          mkdir -p _deploy
          find . -type f -name "*.cs3" -exec cp {} _deploy/ \;
          cp build/plugins.json _deploy/repo.json
          cp build/plugins.json _deploy/plugins.json
          
      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: builds
          force_orphan: true
