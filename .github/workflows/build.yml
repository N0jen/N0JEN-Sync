name: Build and Deploy Extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resmi Cloudstream Şablonunu Entegre Et (Nihai Çözüm)
        run: |
          # 1. Cloudstream geliştiricilerinin resmi şablonunu indir
          curl -L https://github.com/recloudstream/cloudstream-extensions-template/archive/refs/heads/master.zip -o template.zip
          unzip -q template.zip
          
          # 2. Hatasız derleme sağlayan orijinal dosyaları projene kopyala
          cp cloudstream-extensions-template-master/build.gradle.kts .
          cp cloudstream-extensions-template-master/settings.gradle.kts .
          cp -r cloudstream-extensions-template-master/gradle .
          cp cloudstream-extensions-template-master/gradlew .
          cp cloudstream-extensions-template-master/gradlew.bat .
          
          # 3. AtomSpor modülünün ayar dosyasını orijinal şablondan al
          mkdir -p AtomSpor
          cp cloudstream-extensions-template-master/ExampleProvider/build.gradle.kts AtomSpor/
          
          # 4. Ayarları AtomSpor'a göre otomatik değiştir
          sed -i 's/ExampleProvider/AtomSpor/g' settings.gradle.kts
          sed -i 's/name = "ExampleProvider"/name = "AtomSporTV"/' AtomSpor/build.gradle.kts
          sed -i 's/description = "Test"/description = "AtomSporTV Canlı Maç ve TV Kanalları"/' AtomSpor/build.gradle.kts
          sed -i 's/authors = listOf("LagradOst")/authors = listOf("N0jen")/' AtomSpor/build.gradle.kts
          sed -i 's/tvTypes = listOf("Others")/tvTypes = listOf("Live")/' AtomSpor/build.gradle.kts
          
          # 5. Senin yazdığın kodlar yanlışlıkla dışarıdaysa içeri taşı
          if [ -d "src" ]; then
            mv src AtomSpor/
          fi
          
          # 6. Eski, hatalı dosyaları temizle
          rm -f build.gradle settings.gradle AtomSpor/build.gradle
          rm -rf cloudstream-extensions-template-master template.zip
          
          # 7. Sisteme çalışma izni ver
          chmod +x gradlew

      - name: Eklentiyi Derle (.cs3)
        run: ./gradlew make --no-daemon

      - name: Master JSON Oluştur
        run: ./gradlew makePluginsJson --no-daemon

      - name: Dağıtıma Hazırla
        run: |
          mkdir -p _deploy
          find . -type f -name "*.cs3" -exec cp {} _deploy/ \;
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json _deploy/repo.json
            cp build/plugins.json _deploy/plugins.json
          fi
          
      - name: Yayına Al (Deploy)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: builds
          force_orphan: true
