name: Build and Deploy Extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Wrapper Oluştur (Sabit Sürüm)
        run: gradle wrapper --gradle-version 8.4

      - name: Gradlew Yetkilendirmesi
        run: chmod +x ./gradlew

      - name: Eklentiyi Derle (.cs3)
        run: ./gradlew make --no-daemon

      - name: Master JSON Oluştur
        run: ./gradlew makePluginsJson --no-daemon

      - name: Dosyaları Dağıtıma Hazırla
        run: |
          mkdir -p _deploy
          find . -type f -name "*.cs3" -exec cp {} _deploy/ \;
          
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json _deploy/repo.json
            cp build/plugins.json _deploy/plugins.json
          else
            echo "HATA: build/plugins.json bulunamadı!"
            exit 1
          fi

      - name: Builds Dalına Yükle (Deploy)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: builds
          force_orphan: true
          commit_message: "Otomatik Derleme: Eklenti ve JSON Güncellendi"
