name: Build Extensions

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle'ı Hazırla (Önbellek İptal)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Eklentiyi Derle (.cs3 ve manifest oluştur)
        run: gradle make --no-build-cache --refresh-dependencies

      - name: Builds Dalına Yükle
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./build
          force_orphan: true
