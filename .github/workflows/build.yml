name: Build and Deploy Extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Proje Dosyalarını Bağımsız Oluştur
        run: |
          # 1. Kodların dışarıdaysa otomatik içeri al
          if [ -d "src" ]; then
            mkdir -p AtomSpor
            mv src AtomSpor/
          fi
          
          # 2. Ana Ayar Dosyası (Dışarıdan indirmeden kendimiz yazıyoruz)
          cat << 'EOF' > build.gradle.kts
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
              dependencies {
                  classpath("com.github.recloudstream:gradle:-SNAPSHOT")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          EOF
          
          # 3. Settings Dosyası
          cat << 'EOF' > settings.gradle.kts
          rootProject.name = "N0JEN-Sync"
          include(":AtomSpor")
          EOF
          
          # 4. Modül Ayar Dosyası
          mkdir -p AtomSpor
          cat << 'EOF' > AtomSpor/build.gradle.kts
          apply(plugin = "com.lagradost.cloudstream3.plugins")
          
          cloudstream {
              name = "AtomSporTV"
              description = "AtomSporTV Canlı Maç ve TV Kanalları"
              authors = listOf("N0jen")
              version = 1
              tvTypes = listOf("Live")
          }
          EOF

      - name: Gradle 7.6.3 Kurulumu (Cloudstream Referans Hatası Çözümü)
        run: |
          gradle wrapper --gradle-version 7.6.3
          chmod +x gradlew

      - name: Eklentiyi Derle (.cs3)
        run: ./gradlew make --no-daemon

      - name: Master JSON Oluştur
        run: ./gradlew makePluginsJson --no-daemon

      - name: Dağıtıma Hazırla
        run: |
          mkdir -p _deploy
          find . -type f -name "*.cs3" -exec cp {} _deploy/ \;
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json _deploy/repo.json
            cp build/plugins.json _deploy/plugins.json
          fi
          
      - name: Yayına Al (Deploy)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: builds
          force_orphan: true
