name: Build and Deploy Extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Klasörleri ve Dosyaları Otomatik Onar
        run: |
          if [ -d "src" ]; then
            mkdir -p AtomSpor
            mv src AtomSpor/
          fi
          
          cat << 'EOF' > build.gradle.kts
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io") { metadataSources { mavenPom(); artifact() } }
              }
              dependencies {
                  classpath("com.github.recloudstream:gradle:master-SNAPSHOT")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io") { metadataSources { mavenPom(); artifact() } }
              }
          }
          EOF
          
          echo 'rootProject.name = "N0JEN-Sync"' > settings.gradle.kts
          echo 'include(":AtomSpor")' >> settings.gradle.kts
          
          mkdir -p AtomSpor
          cat << 'EOF' > AtomSpor/build.gradle.kts
          import com.lagradost.cloudstream3.plugins.CloudstreamPluginConfiguration
          
          apply(plugin = "com.lagradost.cloudstream3.plugins")
          
          configure<CloudstreamPluginConfiguration> {
              name = "AtomSporTV"
              description = "AtomSporTV Canlı Maç ve TV Kanalları"
              authors = listOf("N0jen")
              version = 1
              tvTypes = listOf("Live")
          }
          EOF

      - name: Sabit Sürüm Gradlew Oluştur
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Extension
        run: ./gradlew make --no-daemon

      - name: Generate JSON
        run: ./gradlew makePluginsJson --no-daemon

      - name: Deploy
        run: |
          mkdir -p _deploy
          find . -type f -name "*.cs3" -exec cp {} _deploy/ \;
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json _deploy/repo.json
            cp build/plugins.json _deploy/plugins.json
          fi
          
      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: builds
          force_orphan: true
