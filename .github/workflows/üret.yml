name: Otomatik Shorts Üretici

on:
  workflow_dispatch:

jobs:
  video-uret:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Kur
      run: pip install replicate requests

    - name: Hızlı FFmpeg Kurulumu
      run: |
        sudo curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
        sudo tar -xf ffmpeg.tar.xz
        sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/

    - name: Profesyonel Botu Çalıştır
      env:
        REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      run: python bot.py

    - name: Üretilen Videoyu İndirmeye Hazırla
      uses: actions/upload-artifact@v4
      with:
        name: hazir-shorts-videolarim
        path: final_shorts.mp4
