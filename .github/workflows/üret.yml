name: Otomatik Shorts Üretici

on:
  workflow_dispatch: 

jobs:
  video-uret:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: FFmpeg Kurulumu (Video Motoru)
      run: sudo apt-get update && sudo apt-get install ffmpeg -y

    - name: Botu Çalıştır ve Videoyu Üret
      run: python bot.py

    - name: Üretilen Videoyu GitHub'a Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: hazir-shorts-videolarim
        path: yeni_short_video.mp4
