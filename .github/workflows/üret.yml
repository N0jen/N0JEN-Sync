name: Otomatik Shorts Üretici

on:
  workflow_dispatch: 

jobs:
  video-uret:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Hızlı FFmpeg Kurulumu (Statik Yöntem)
      run: |
        sudo curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
        sudo tar -xf ffmpeg.tar.xz
        sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
        sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/

    - name: Botu Çalıştır ve Videoyu Üret
      run: python bot.py

    - name: Üretilen Videoyu GitHub'a Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: hazir-shorts-videolarim
        path: yeni_short_video.mp4
