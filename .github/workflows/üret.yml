name: Yağmur Videosu Oluşturucu Bot

on:
  workflow_dispatch: # Sadece GitHub üzerinden manuel olarak butona bastığınızda çalışır

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: FFmpeg Kurulumu (Hatanın Çözüldüğü Yer)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          architecture: x64

      - name: Python Kütüphanelerini Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Video Botunu Çalıştır
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python bot.py

      - name: Hazır Videoyu Çıktı Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: final-rain-video
          path: final_shorts.mp4
          retention-days: 7
