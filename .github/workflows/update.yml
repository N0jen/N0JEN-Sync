name: Generate M3U Playlists

on:
  schedule:
    - cron: '0 */12 * * *' # Her 12 saatte bir günceller
  workflow_dispatch: # Manuel olarak tetikleme butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosyaları depoya yazıp pushlamak için gerekli izin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          # Kütüphaneleri doğrudan burada yüklüyoruz (requirements.txt'ye gerek kalmıyor)
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper and Generate M3U
        run: |
          python main.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik güncelleme: M3U listeleri yenilendi"
          file_pattern: "*.m3u"
