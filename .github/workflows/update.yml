name: Otomatik M3U Guncelleme

on:
  schedule:
    - cron: '0 */12 * * *' # Her 12 saatte bir otomatik çalışır
  workflow_dispatch: # Actions sekmesinden manuel olarak tetiklemeye izin verir

# Depoya yazma işlemi yapabilmesi için gereken yetki
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Dönüştürme Betiğini Çalıştır
        run: python update_m3u.py

      - name: Değişiklikleri Depoya Kaydet (Commit & Push)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add liste.m3u
          # Eğer dosyada değişiklik varsa commit yap ve pushla, yoksa hata verme
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik güncellendi: liste.m3u" && git push)
