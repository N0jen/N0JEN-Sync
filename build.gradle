buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
        
        // ÇÖZÜM 1: Jitpack hatalarını aşmak için değişken etiketler yerine 
        // doğrudan son çalışan "32895aedb6" commit hash'ini kullanıyoruz.
        classpath 'com.github.recloudstream:gradle:32895aedb6'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.lagradost.cloudstream3.gradle'

cloudstream {
    pluginName = "N0JEN Sync"
    pluginAuthor = "N0jen"
    pluginDescription = "AtomSpor canlı maç ve TV yayınları"
    pluginVersion = 1
    pluginTypes = ["tv"]
}

android {
    namespace 'com.n0jensync'
    compileSdk 33
    
    defaultConfig {
        minSdk 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // ÇÖZÜM 2: Cloudstream ana yapısı için de Eylül 2026'daki en güncel 
    // sorunsuz derleme olan "d77c856" commit hash'ini sabitliyoruz.
    implementation 'com.github.recloudstream:Cloudstream:d77c856'
    implementation 'org.jsoup:jsoup:1.15.3'
}
